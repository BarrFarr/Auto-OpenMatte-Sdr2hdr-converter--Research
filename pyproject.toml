[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-openmatte"
version = "0.1.0"
description = "Automatic HDR Open Matte extension and SDR-to-HDR conversion"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "numpy==2.5.2",
    "scipy==1.18.0",
    "opencv-python-headless==5.0.0.93",
    "cupy-cuda13x==14.1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1",
    "mypy>=1.5",
]

[project.scripts]
auto_openmatte = "auto_openmatte.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402"]

[tool.mypy]
python_version = "3.10"
strict = true
